    <radialGradient id="fade" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="mesh-mask">
      <rect width="1920" height="1080" fill="url(#fade)"/>
    </mask>
  </defs>

